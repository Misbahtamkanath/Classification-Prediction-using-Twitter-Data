{% extends 'base.html' %}
{% load static %}

{% block contents %}
<!-- Admin Login Section -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <!-- Admin Login Card -->
                <div class="glass card shadow-lg border-0 rounded-4 p-4 p-md-5">
                    <div class="card-body text-center">
                        <!-- Title -->
                        <div class="mb-5">
                            <i class="fas fa-user-shield fa-3x text-warning mb-4 opacity-90"></i>
                            <h2 class="fw-bold mb-2 display-6">Admin Panel Access</h2>
                            <p class="text-muted lead mb-0">Sign in to manage sentiment analysis dashboard</p>
                        </div>

                        <!-- Messages -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-warning alert-dismissible fade show rounded-3 mb-4" role="alert">
                                    <div class="d-flex align-items-center justify-content-center">
                                        <i class="fas fa-exclamation-triangle me-2 fs-5"></i>
                                        {{ message }}
                                    </div>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Admin Login Form -->
                        <form action="{% url 'AdminLoginCheck' %}" method="POST" novalidate>
                            {% csrf_token %}
                            
                            <!-- Login ID -->
                            <div class="mb-5">
                                <label for="loginid" class="form-label fw-bold text-white mb-3 fs-5">
                                    <i class="fas fa-user me-2"></i>Admin Login ID
                                </label>
                                <input type="text" 
                                       class="form-control form-control-lg glass py-4" 
                                       id="loginid" 
                                       name="loginid" 
                                       required
                                       placeholder="Enter admin username"
                                       autocomplete="username">
                            </div>

                            <!-- Password -->
                            <div class="mb-5">
                                <label for="pswd" class="form-label fw-bold text-white mb-3 fs-5">
                                    <i class="fas fa-lock me-2"></i>Admin Password
                                </label>
                                <input type="password" 
                                       class="form-control form-control-lg glass py-4" 
                                       id="pswd" 
                                       name="pswd" 
                                       required
                                       placeholder="Enter admin password"
                                       autocomplete="current-password">
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold py-4 fs-5 shadow-lg rounded-pill">
                                    <i class="fas fa-sign-in-alt me-2"></i>Access Admin Panel
                                </button>
                                <button type="reset" class="btn btn-outline-light btn-lg fw-bold py-4 fs-5 rounded-pill">
                                    <i class="fas fa-redo me-2"></i>Reset Form
                                </button>
                            </div>
                        </form>

                        <!-- Back to User Login -->
                        <div class="mt-5 pt-4 border-top border-white border-opacity-20">
                            <a href="{% url 'UserLogin' %}" class="btn btn-link text-white text-decoration-none p-0 fw-semibold">
                                <i class="fas fa-arrow-left me-1"></i>Back to User Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
