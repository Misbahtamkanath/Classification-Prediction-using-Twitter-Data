{% extends 'base.html' %}
{% load static %}

{% block contents %}
<!-- User Login Section -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <!-- Login Card -->
                <div class="glass card shadow-lg border-0 rounded-4 p-4 p-md-5">
                    <div class="card-body text-center">
                        <!-- Title -->
                        <div class="mb-4">
                            <i class="fab fa-twitter fa-3x text-primary mb-3 opacity-75"></i>
                            <h2 class="fw-bold mb-1">Twitter Login</h2>
                            <p class="text-muted mb-0">Sign in to access sentiment analysis</p>
                        </div>

                        <!-- Messages -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-success alert-dismissible fade show" role="alert">
                                    <i class="fas fa-check-circle me-2"></i>{{ message }}
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Login Form -->
                        <form action="{% url 'UserLoginCheck' %}" method="POST">
                            {% csrf_token %}
                            
                            <!-- Login ID -->
                            <div class="mb-4">
                                <label for="loginid" class="form-label fw-semibold text-white">
                                    <i class="fas fa-user me-2"></i>Login ID
                                </label>
                                <input type="text" 
                                       class="form-control form-control-lg glass" 
                                       id="loginid" 
                                       name="loginid" 
                                       required
                                       placeholder="Enter your username or email">
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <label for="pswd" class="form-label fw-semibold text-white">
                                    <i class="fas fa-lock me-2"></i>Password
                                </label>
                                <input type="password" 
                                       class="form-control form-control-lg glass" 
                                       id="pswd" 
                                       name="pswd" 
                                       required
                                       placeholder="Enter your password">
                            </div>

                            <!-- Buttons -->
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold py-3">
                                    <i class="fas fa-sign-in-alt me-2"></i>Login
                                </button>
                                <button type="reset" class="btn btn-outline-light btn-lg fw-semibold py-3">
                                    <i class="fas fa-redo me-2"></i>Reset
                                </button>
                            </div>
                        </form>

                        <!-- Register Link -->
                        <div class="mt-4 pt-3 border-top border-white border-opacity-20">
                            <p class="text-center mb-0">
                                <a href="{% url 'UserRegister' %}" class="text-white text-decoration-none fw-semibold">
                                    <i class="fas fa-user-plus me-1"></i>Don't have an account? Register
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
